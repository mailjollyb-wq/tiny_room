<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Room Makeover</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe9df;--bg2:#fdd9e6;--ink:#5a3a35;--soft:#9a7a72;--card:#fffaf5;--pill:#fff3ea;--accent:#ff8fa8;--accent2:#ffb36b;--track:#f3d9cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a2a2e;--bg2:#2e2438;--ink:#ffe9df;--soft:#c9a9a0;--card:#4a3640;--pill:#40303a;--track:#5a444c}}
:root[data-theme="dark"]{--bg1:#3a2a2e;--bg2:#2e2438;--ink:#ffe9df;--soft:#c9a9a0;--card:#4a3640;--pill:#40303a;--track:#5a444c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:720px;padding:12px 14px 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lvl b{font-size:1.5rem;font-weight:600;display:block;line-height:1.1}
.lvl small{color:var(--soft);font-size:.95rem}
.timer{background:var(--pill);border-radius:999px;padding:6px 18px;font-size:1.7rem;font-weight:600;min-width:88px;text-align:center;box-shadow:0 3px 0 var(--track)}
.timer.low{color:#e5484d;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.bars{margin:10px 0 8px}
.track{height:12px;border-radius:9px;background:var(--track);overflow:hidden}
.fill{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s}
.tbar{height:6px;margin-top:6px}.tbar .fill{background:#8fd3b6;transition:width .25s linear}
.prog{display:flex;justify-content:space-between;font-size:.95rem;color:var(--soft);margin-top:4px}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dot{width:26px;height:26px;border-radius:50%;border:0;background:var(--track);color:var(--soft);font:inherit;font-size:.8rem;cursor:pointer}
.dot.ok{background:var(--accent2);color:#fff}.dot.cur{background:var(--accent);color:#fff;transform:scale(1.18)}.dot:disabled{cursor:default;opacity:.55}
#stage{position:relative;width:100%;aspect-ratio:600/420;container-type:inline-size;touch-action:none;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 var(--track)}
#stage>svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;width:calc(16cqw*var(--s));transform:translate(-50%,-86%);pointer-events:none}
.slot.w{transform:translate(-50%,-50%)}
.slot svg,.chip svg{display:block;width:100%;height:auto;overflow:visible}
.slot svg{filter:brightness(0) opacity(.24);transition:filter .2s}
.slot.f::after{content:'';position:absolute;left:50%;top:80%;width:78%;height:13%;transform:translateX(-50%);background:rgba(40,20,10,.22);border-radius:50%;z-index:-1}
.slot.on svg{filter:drop-shadow(0 3px 2px rgba(40,20,10,.35));animation:pop .45s}
@keyframes pop{0%{transform:scale(.6) translateY(-30%)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#stage.party .slot.on svg{animation:hop .6s ease-in-out 3;animation-delay:calc(var(--i)*70ms)}
@keyframes hop{50%{transform:translateY(-14%) rotate(4deg)}}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--card);border-radius:22px;padding:12px;margin-top:12px;box-shadow:0 4px 0 var(--track);min-height:80px}
.chip{width:66px;height:66px;display:grid;place-items:center;padding:7px;background:var(--pill);border-radius:16px;cursor:grab;touch-action:none;box-shadow:0 3px 0 var(--track);transition:transform .15s}
.chip:hover{transform:translateY(-3px)}
.chip.lift{opacity:.3}.chip.used{display:none}
.drag{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.drag svg{display:block;width:100%;overflow:visible}
.drag.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(calc(-50% - 12px),-50%) rotate(-8deg)}40%{transform:translate(calc(-50% + 12px),-50%) rotate(8deg)}60%{transform:translate(calc(-50% - 8px),-50%) rotate(-5deg)}80%{transform:translate(calc(-50% + 8px),-50%) rotate(4deg)}}
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(90,50,50,.45);backdrop-filter:blur(3px);padding:20px}
.ov.hide{display:none}
.card{background:var(--card);border-radius:28px;padding:28px 30px;text-align:center;max-width:380px;box-shadow:0 8px 0 var(--track),0 20px 40px rgba(0,0,0,.25);animation:pop .5s}
.card .big{font-size:4.2rem;line-height:1.1}
.card h2{margin:6px 0;font-size:1.9rem}
.card p{margin:0 0 16px;color:var(--soft);font-size:1.05rem}
.btn{font:inherit;font-size:1.2rem;font-weight:600;color:#fff;background:linear-gradient(180deg,var(--accent),#ff7597);border:0;border-radius:999px;padding:11px 32px;cursor:pointer;box-shadow:0 4px 0 #d95a7b}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d95a7b}
.btn:focus-visible,.dot:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#conf i{position:absolute;top:-8%;font-style:normal;animation:fall var(--d) linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){#stage.party .slot.on svg,.timer.low{animation:none}}
@media (max-width:480px){.chip{width:56px;height:56px;padding:5px}.timer{font-size:1.4rem;padding:4px 14px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="lvl"><b id="lv">Level 1</b><small id="nm"></small></div>
    <div class="timer" id="tm">60</div>
  </div>
  <div class="bars">
    <div class="track"><div class="fill" id="pf"></div></div>
    <div class="track tbar"><div class="fill" id="tf" style="width:100%"></div></div>
    <div class="prog"><span id="pt">0 of 0 placed</span><span>Match each piece to its shadow</span></div>
  </div>
  <div class="dots" id="dots"></div>
  <div id="stage"></div>
  <div class="tray" id="tray"></div>
</div>
<div id="conf"></div>
<div class="ov" id="ov"><div class="card"><div class="big" id="oe"></div><h2 id="ot"></h2><p id="op"></p><button class="btn" id="ob"></button></div></div>

roundWinR:a(()=>`<circle cx="50" cy="50" r="28" fill="#6b3a28"/><circle cx="50" cy="50" r="22" fill="#e5422d"/><path d="M50,28V72M28,50H72M34,34L66,66M66,34L34,66" stroke="#6b3a28" stroke-width="4"/><circle cx="50" cy="50" r="7" fill="#ffd27a"/>`,1,1),
tableAs:a(()=>tb('#b7b08a','#7a4a2c',cy(10,10,'#4a4a44',50,52)+cy(8,5,'#6a6a60',50,41)),1.1)
};
const side=k=>k=='w0'||k=='w1'?'L':'R';
const ico=(key,k)=>{const o=A[key];let s=o.f();if(k&&o.w){const L=side(k)=='L';s=`<g transform="matrix(1,${L?-.5:.5},0,1,0,${L?25:-25})">${s}</g>`}return`<svg viewBox="0 0 100 100">${s}</svg>`};
// spots in a 600x420 stage
const SP={f0:[390,300],f1:[200,295],f2:[300,350],f3:[485,262],f4:[115,258],f5:[300,262],f6:[395,215],f7:[210,222],w1:[190,118],w2:[410,118],w0:[100,168],w3:[500,170]};
/* ---------- the 10 rooms (one per reference image) ---------- */
// bg = backdrop, f=[type t|p,c1,c2], w=[wallL,wallR,pattern s|g|n,lineColor], r = rim wood
const L=[
{n:'Green Bedroom',bg:'#2f3d36',f:['t','#8a5a3a','#74482d'],w:['#f2ddbb','#e8cfa6','n'],r:'#d8ad70',i:[['bed','f6'],['dresserG','f7'],['rug1','f5'],['frameBf','w1']],x:[]},
{n:'Music Café',bg:'#3c4560',f:['t','#d2b48c','#bf9d72'],w:['#b9d49c','#a9c88c','n'],r:'#9a6038',i:[['piano','f6'],['tableCake','f0'],['chairG','f2'],['signCoffee','f1'],['winG','w1']],x:['stool']},
{n:'Bakery Café',bg:'#6b7482',f:['p','#c98f5b'],w:['#f4ecd0','#efe3c0','n'],r:'#e8dcb8',i:[['counterG','f7'],['display','f6'],['menu','f1'],['tableCafe','f0'],['ivy','w2']],x:['chairW','plantBig']},
{n:'Gingham Kitchen',bg:'#b4bac0',f:['p','#e0b58a'],w:['#fbf1e4','#f4e3cf','n'],r:'#c98f64',i:[['fridgeC','f6'],['counterB','f7'],['tableCheck','f0'],['chairW','f2'],['curtainR','w1'],['plates','w2']],x:['stool','catPlush']},
{n:'Woodo Hut',bg:'#f0c09c',f:['p','#e0a263'],w:['#f6ead8','#efddc3','n'],r:'#d89a5a',i:[['plantBig','f4'],['tableWood','f0'],['cabBrown','f6'],['basket','f1'],['roundWin','w1'],['stool','f2']],x:['plantTbl','chest','chairW']},
{n:'Pink Bathroom',bg:'#8b5b9e',f:['t','#fbf4ee','#e9dcd2'],w:['#fff3ed','#ffe9e0','g','#ff8d7a'],r:'#e8b987',i:[['washer','f7'],['shower','f6'],['vanity','f3'],['mirrorR','w2'],['stoolTowel','f1'],['rug2','f5'],['laundry','f4']],x:['stool','tub']},
{n:'Plaid Living Kitchen',bg:'#f2ebe2',f:['p','#d19a63'],w:['#f7e9d2','#f3dfc0','n'],r:'#e4a56e',i:[['sofaR','f7'],['armR','f0'],['stove','f6'],['cabsG','w2'],['curtainP','w1'],['clock','w3'],['rug3','f5']],x:['fridgeG','stool','chairW']},
{n:'Retro Green Kitchen',bg:'#cfc49c',f:['p','#a66a42'],w:['#f6f0e0','#eee3c8','g','#8ec152'],r:'#5b3524',i:[['fridgeG','f7'],['tableG','f0'],['chairW','f2'],['chairW','f3'],['counterW','f6'],['hood','w2'],['winW','w1'],['ivy','w3']],x:['fridgeC','stool','plantTbl']},
{n:'Candle Bathroom',bg:'#3b2b27',f:['t','#fff4ea','#ecd9c8'],w:['#fbe2c6','#f6d3ae','g','#e8c09a'],r:'#c58a50',i:[['tub','f7'],['sink','f6'],['mirrorO','w1'],['lampW','w2'],['archWin','w3'],['tableCandle','f1'],['rug4','f5'],['plantTbl','f3']],x:['stoolTowel','vanity','mirrorR']},
{n:'Lantern Room',bg:'#d0c2a8',f:['t','#6a6a50','#5b5a44'],w:['#5a4a3a','#4e3f31','n'],r:'#7a4a2c',i:[['chest','f7'],['tableAs','f0'],['chairW','f2'],['jars','f3'],['barrel','f1'],['roundWinR','w2'],['painting','w1'],['lantern','w3'],['scroll','f4']],x:['plantBig','stool','basket','cabBrown']}
];
function room(d){
  const [ft,f1,f2]=d.f,[w1,w2,wp,lc]=d.w,r=d.r,pt=(u,v)=>`${40+260*(u+v)},${270+120*(u-v)}`;
  let s=`<svg viewBox="0 0 600 420"><defs><filter id="bl"><feGaussianBlur stdDeviation="9"/></filter><radialGradient id="gl" cx=".72" cy=".25" r=".7"><stop offset="0" stop-color="#ffe29a" stop-opacity=".5"/><stop offset="1" stop-color="#ffe29a" stop-opacity="0"/></radialGradient></defs>`;
  s+=`<ellipse cx="300" cy="410" rx="285" ry="20" fill="#000" opacity=".3" filter="url(#bl)"/>`;
  s+=`<polygon points="40,270 300,390 300,414 40,294" fill="${sh(r,.65)}"/><polygon points="300,390 560,270 560,294 300,414" fill="${sh(r,.85)}"/>`;
  s+=`<polygon points="40,270 300,150 300,30 40,150" fill="${w1}"/><polygon points="300,150 560,270 560,150 300,30" fill="${w2}"/><polygon points="300,150 560,270 560,150 300,30" fill="#000" opacity=".07"/>`;
  if(wp=='s'){for(let x=66;x<300;x+=26){const t=120*(x-40)/260;s+=`<line x1="${x}" y1="${150-t}" x2="${x}" y2="${270-t}" stroke="#fff" stroke-opacity=".3" stroke-width="7"/>`}}
  if(wp=='g'){for(let x=40;x<=300;x+=26){const t=120*(x-40)/260;s+=`<line x1="${x}" y1="${150-t}" x2="${x}" y2="${270-t}" stroke="${lc}" stroke-width="1.3"/>`}
    for(let x=300;x<=560;x+=26){const t=120*(x-300)/260;s+=`<line x1="${x}" y1="${30+t}" x2="${x}" y2="${150+t}" stroke="${lc}" stroke-width="1.3"/>`}
    for(let k=1;k<5;k++)s+=`<line x1="40" y1="${150+k*24}" x2="300" y2="${30+k*24}" stroke="${lc}" stroke-width="1.3"/><line x1="300" y1="${30+k*24}" x2="560" y2="${150+k*24}" stroke="${lc}" stroke-width="1.3"/>`}
  s+=`<polygon points="40,150 40,270 31,265 31,145" fill="${sh(w1,.8)}"/><polygon points="560,150 560,270 569,265 569,145" fill="${sh(w2,.75)}"/>`;
  const N=ft=='t'?6:9,M=ft=='t'?6:1;
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){const u0=i/N,u1=(i+1)/N,v0=j/M,v1=(j+1)/M,c=ft=='t'?((i+j)%2?f1:f2):(i%2?sh(f1,.94):f1);
    s+=`<polygon points="${pt(u0,v0)} ${pt(u1,v0)} ${pt(u1,v1)} ${pt(u0,v1)}" fill="${c}" stroke="#000" stroke-opacity=".1" stroke-width=".8"/>`}
  s+=`<polyline points="40,270 300,150 560,270" fill="none" stroke="${sh(r,.9)}" stroke-width="5" opacity=".8" stroke-linejoin="round"/>`;
  s+=`<polyline points="31,152 300,28 569,152" fill="none" stroke="${sh(r,.65)}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="31,145 300,21 569,145" fill="none" stroke="${r}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`;
  return s+`<polygon points="40,150 300,30 560,150 560,270 300,390 40,270" fill="url(#gl)"/></svg>`;
}
/* ---------- game ---------- */
const stage=$('#stage'),tray=$('#tray');
let lv=0,unlocked=0,end=0,tm=null,done=0,total=0,running=false,nt=null;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function load(i){
  clearInterval(tm);clearTimeout(nt);hide();$('#conf').innerHTML='';
  lv=i;const d=L[i];done=0;total=d.i.length;
  $('#lv').textContent='Level '+(i+1);$('#nm').textContent=d.n;
  stage.className='';stage.style.background=`radial-gradient(circle at 50% 42%,${sh(d.bg,1.35)},${d.bg} 75%)`;
  stage.innerHTML=room(d)+d.i.map(([key,k],j)=>{const [x,y]=SP[k],o=A[key];
    return `<div class="slot ${k[0]}" data-k="${key}" data-x="${x}" data-y="${y}" style="left:${x/6}%;top:${y/4.2}%;z-index:${key.startsWith('rug')?2:k[0]=='w'?1:y|0};--s:${o.s};--i:${j}">${ico(key,k)}</div>`}).join('');
  tray.innerHTML=shuffle(d.i.map(a=>a[0]).concat(d.x)).map(k=>`<div class="chip" data-k="${k}">${ico(k)}</div>`).join('');
  prog();dots();
  running=true;end=Date.now()+60000;tm=setInterval(tick,200);tick();
}
function prog(){$('#pf').style.width=done/total*100+'%';$('#pt').textContent=done+' of '+total+' placed'}
function dots(){$('#dots').innerHTML=L.map((_,i)=>`<button class="dot ${i<unlocked?'ok':''} ${i==lv?'cur':''}" ${i>unlocked?'disabled':''} data-i="${i}" aria-label="Level ${i+1}">${i+1}</button>`).join('')}
$('#dots').onclick=e=>{const b=e.target.closest('.dot');if(b&&!b.disabled)load(+b.dataset.i)};
function tick(){
  const t=Math.max(0,end-Date.now());
  $('#tm').textContent=Math.ceil(t/1000);$('#tm').classList.toggle('low',t<10000);$('#tf').style.width=t/600+'%';
  if(t<=0&&running){running=false;clearInterval(tm);show('⏰',"Time's up!",'The room needs a little more love. Give it another go!','Retry',()=>load(lv))}
}
function show(e,t,p,b,f){$('#oe').textContent=e;$('#ot').textContent=t;$('#op').textContent=p;$('#ob').textContent=b;$('#ob').onclick=()=>{clearTimeout(nt);f()};$('#ov').classList.remove('hide');$('#ob').focus()}
function hide(){$('#ov').classList.add('hide')}
tray.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip');if(!c||!running)return;
  e.preventDefault();
  const g=document.createElement('div');g.className='drag';g.innerHTML=c.innerHTML;
  g.style.width=stage.getBoundingClientRect().width*.16*A[c.dataset.k].s+'px';
  document.body.appendChild(g);c.classList.add('lift');
  const mv=ev=>{g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'};mv(e);
  const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);drop(c,g,ev.clientX,ev.clientY)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
});
function drop(c,g,x,y){
  const r=stage.getBoundingClientRect(),k=600/r.width,px=(x-r.left)*k,py=(y-r.top)*k;
  let best=null,bd=62;
  stage.querySelectorAll('.slot:not(.on)').forEach(s=>{
    if(s.dataset.k!==c.dataset.k)return;
    const d=Math.hypot(px-s.dataset.x,py-s.dataset.y);if(d<bd){bd=d;best=s}
  });
  if(best&&running){g.remove();c.classList.add('used');best.classList.add('on');done++;prog();if(done===total)win()}
  else{
    g.classList.add('shake');
    setTimeout(()=>{const b=c.getBoundingClientRect();g.style.transition='left .28s,top .28s';
      g.style.left=b.left+b.width/2+'px';g.style.top=b.top+b.height/2+'px';
      setTimeout(()=>{g.remove();c.classList.remove('lift')},290)},380);
  }
}
function win(){
  running=false;clearInterval(tm);stage.classList.add('party');
  const cf=$('#conf'),E=['💖','✨','🌸','⭐','🎀'];cf.innerHTML='';
  for(let i=0;i<34;i++)cf.insertAdjacentHTML('beforeend',`<i style="left:${Math.random()*100}%;font-size:${16+Math.random()*18}px;--d:${2+Math.random()*2}s;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*.6}s">${E[Math.random()*5|0]}</i>`);
  setTimeout(()=>{
    if(lv<9){
      unlocked=Math.max(unlocked,lv+1);dots();
      show('🏡','So cosy!','Level '+(lv+1)+' done. Level '+(lv+2)+' is unlocked.','Next room',()=>load(lv+1));
      nt=setTimeout(()=>load(lv+1),2600);
    }else{
      unlocked=9;dots();
      show('👑','All 10 rooms done!','You turned every tiny room into a home. Amazing decorating!','Play again',()=>{unlocked=0;load(0)});
    }
  },1400);
}
show('🏠','Tiny Room Makeover','Drag each piece onto its shadow before 60 seconds run out. Ten cosy rooms are waiting.','Start',()=>load(0));
